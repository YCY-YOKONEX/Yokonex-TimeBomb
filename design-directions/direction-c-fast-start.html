<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时间炸弹 - 快速开局</title>
  <!-- 假设：老玩家更关心少点几次；系统可自动选择空闲通道，但仍允许手动调整。 -->
  <style>
    *{box-sizing:border-box}:root{--ink:#101010;--red:#df3e36;--yellow:#f7d35f;--mint:#69cbae;--paper:#f7f6f2;--line:#d6d2c9}body{margin:0;background:#ecebe6;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:0}button,select{font:inherit}button{cursor:pointer}.stage{min-height:100vh;display:grid;place-items:center;padding:32px}.board{display:flex;align-items:center;gap:34px}.note{width:250px}.eyebrow{font-size:12px;font-weight:900;color:var(--red)}h1{margin:7px 0 12px;font-size:30px}.note p{margin:0;color:#5e5a53;font-size:14px;line-height:1.75}.phone{width:390px;height:844px;background:var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 26px 60px #0003;padding:10px}.screen{height:100%;background:var(--paper);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.hero{padding:22px 20px 18px;background:var(--yellow)}.brand{font-size:12px;font-weight:900}.hero-row{display:flex;align-items:end;justify-content:space-between;margin-top:10px}.hero h2{margin:0;font-size:32px;line-height:1}.ready-pill{padding:7px 9px;background:var(--ink);color:white;border-radius:6px;font-size:11px;font-weight:900}.content{flex:1;overflow:auto;padding:14px 16px 100px}.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.status{padding:10px 8px;background:white;border:1px solid var(--line);border-radius:8px}.status span{display:block;color:#777168;font-size:10px}.status b{display:block;margin-top:4px;font-size:13px}.status.good b{color:#237e63}.panel{margin-bottom:10px;padding:13px;background:white;border:1px solid var(--line);border-radius:8px}.panel-head{display:flex;align-items:center;margin-bottom:10px}.panel-head b{font-size:15px}.panel-head button{margin-left:auto;border:0;background:#ece9e2;border-radius:6px;padding:7px 9px;font-size:10px;font-weight:900}.devices{display:flex;gap:7px}.device{flex:1;padding:10px;border:1px solid var(--mint);border-radius:7px}.device span{display:block;font-size:10px;color:#6f6a62}.device b{display:block;margin-top:3px;font-size:12px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.preset{height:59px;border:1px solid var(--line);border-radius:7px;background:white;text-align:left;padding:8px}.preset b{display:block;font-size:12px}.preset span{display:block;margin-top:3px;color:#777;font-size:9px}.preset.active{background:var(--ink);border-color:var(--ink);color:white}.preset.active span{color:#ffffffa6}.custom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}select,.value{height:36px;width:100%;border:1px solid var(--line);border-radius:6px;background:#f0ede6;padding:0 7px;font-size:11px;font-weight:800}.value{display:flex;align-items:center;justify-content:center}.players{display:flex;flex-wrap:wrap;gap:7px}.player{display:flex;align-items:center;gap:6px;padding:7px 8px;background:#f0ede6;border-radius:6px;font-size:11px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}.auto{width:100%;height:41px;margin-top:10px;border:0;border-radius:7px;background:var(--yellow);font-weight:900}.footer{position:absolute;left:10px;right:10px;bottom:10px;padding:12px 16px 16px;background:linear-gradient(transparent,var(--paper) 22%)}.phone-wrap{position:relative}.start{width:100%;height:58px;border:0;border-radius:8px;background:var(--red);color:white;font-size:18px;font-weight:900}.meta{text-align:center;margin-top:6px;color:#777168;font-size:10px}.check{display:inline-flex;align-items:center;gap:5px;color:#237e63;font-size:10px;font-weight:900}.check:before{content:"";width:7px;height:7px;background:var(--mint);border-radius:50%}@media(max-width:760px){.stage{padding:14px}.board{display:block}.note{width:390px;max-width:100%;padding-bottom:18px}.phone{max-width:100%}}
  </style>
</head>
<body>
  <main class="stage"><div class="board"><aside class="note"><div class="eyebrow">方向 C</div><h1>快速开局</h1><p>系统主动完成通道分配和批量测试。用户只需连接设备、选一个玩法预设，再确认玩家，操作次数最少。</p></aside><div class="phone-wrap"><section class="phone"><div class="screen"><header class="hero"><div class="brand">时间炸弹</div><div class="hero-row"><h2>快速开局</h2><span class="ready-pill">约 20 秒</span></div></header><div class="content"><div class="strip"><div class="status good"><span>设备</span><b>2 台在线</b></div><div class="status good"><span>通道</span><b>3 个可用</b></div><div class="status"><span>玩家</span><b>3 位</b></div></div><section class="panel"><div class="panel-head"><b>连接设备</b><button>管理</button></div><div class="devices"><div class="device"><span>EMS-01 · 一代</span><b>通道 A / B</b></div><div class="device"><span>EMS-02 · 二代</span><b>通道 A / B</b></div></div></section><section class="panel"><div class="panel-head"><b>选择玩法</b><span style="margin-left:auto" class="check">可随时微调</span></div><div class="presets"><button class="preset"><b>轻度</b><span>20 · 脉冲 · 90秒</span></button><button class="preset active"><b>标准</b><span>30 · 脉冲 · 60秒</span></button><button class="preset"><b>刺激</b><span>45 · 连击 · 45秒</span></button></div><div class="custom"><div class="value" id="power">强度 30</div><select><option>脉冲波</option><option>渐强波</option><option>连击波</option></select><select><option>60 秒</option><option>30 秒</option><option>90 秒</option></select></div></section><section class="panel"><div class="panel-head"><b>绑定玩家</b><button>编辑</button></div><div class="players"><span class="player"><i class="dot"></i>玩家 1 · 01-A</span><span class="player"><i class="dot"></i>玩家 2 · 01-B</span><span class="player"><i class="dot"></i>玩家 3 · 02-A</span></div><button class="auto" onclick="this.textContent='测试完成 · 3 / 3'">自动分配并测试</button></section></div></div></section><div class="footer"><button class="start" onclick="this.textContent='3 · 2 · 1'">点燃炸弹</button><div class="meta">所有通道测试通过后可开始</div></div></div></div></main>
  <script>
    document.querySelectorAll('.preset').forEach((button,index)=>button.onclick=()=>{document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));button.classList.add('active');document.getElementById('power').textContent=['强度 20','强度 30','强度 45'][index]});
  </script>
</body>
</html>
